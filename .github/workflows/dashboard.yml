name: Build dashboard
on:
  push:
    branches: [main]
    paths-ignore: [state.json]
  schedule:
    # Ready just before 6am Indianapolis year-round. GitHub cron is UTC-only, so fire at both 9:45 and 10:45 UTC
    # and let the "gate" job let through only the run that lands between 5:30 and 6:30 local time.
    - cron: "45 9 * * *"
    - cron: "45 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          m=$((10#$(TZ=America/Indiana/Indianapolis date +%H) * 60 + 10#$(TZ=America/Indiana/Indianapolis date +%M)))
          if [ "$m" -ge 330 ] && [ "$m" -lt 390 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Local minute-of-day is $m, skipping"; fi
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m dashboard.build
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GMAIL_REFRESH_PERSONAL: ${{ secrets.GMAIL_REFRESH_PERSONAL }}
          GMAIL_REFRESH_SUPPORT: ${{ secrets.GMAIL_REFRESH_SUPPORT }}
          GMAIL_REFRESH_CASCADE: ${{ secrets.GMAIL_REFRESH_CASCADE }}
          ADDR_PERSONAL: ${{ secrets.ADDR_PERSONAL }}
          ADDR_SUPPORT: ${{ secrets.ADDR_SUPPORT }}
          ADDR_CASCADE: ${{ secrets.ADDR_CASCADE }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          RUNSIGNUP_API_KEY: ${{ secrets.RUNSIGNUP_API_KEY }}
          RUNSIGNUP_API_SECRET: ${{ secrets.RUNSIGNUP_API_SECRET }}
      - name: Refuse to publish unencrypted
        run: grep -q "AES-GCM" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  notify:
    needs: [gate, deploy]
    if: github.event_name == 'schedule' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python dashboard/notify.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
