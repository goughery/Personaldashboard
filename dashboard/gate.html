<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title>
<style>body{font:16px system-ui;background:#0f1115;color:#eee;display:grid;place-items:center;min-height:100vh;margin:0}
form{display:grid;gap:12px;width:min(320px,86vw)}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #444;background:#1b1e26;color:#eee}
button{background:#4f8cff;border:0;font-weight:600}#e{color:#f88;min-height:1.2em}</style></head>
<body><form id="f"><h2>🔒 Dashboard</h2><input id="p" type="password" placeholder="Passphrase" autocomplete="current-password" autofocus>
<button>Unlock</button><div id="e"></div></form>
<script>
const BLOB=/*BLOB*/null,b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(BLOB.salt),iterations:250000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(BLOB.iv)},key,b64(BLOB.ct)));
  const i=pt.indexOf("\0");const page=pt.slice(0,i),data=pt.slice(i+1);
  document.open();document.write(page.replace("<head>","<head><script>window.__DATA__="+data.replace(/</g,"\\u003c")+"<\/script>"));document.close();
}
async function go(pw){try{await open(pw);try{localStorage.setItem("dpw",pw)}catch(e){}}catch(e){document.getElementById("e").textContent="Wrong passphrase";try{localStorage.removeItem("dpw")}catch(e){}}}
f.onsubmit=e=>{e.preventDefault();go(p.value)};
try{const s=localStorage.getItem("dpw");if(s)go(s)}catch(e){}
</script></body></html>
